<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Plateforme TOEIC/TOEFL</title>
  <meta name="description" content="Créez votre compte sur la plateforme de préparation au TOEIC/TOEFL">
  <link rel="stylesheet" href="inscriptionStyle.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <div class="wrapper">

    <!-- ─── GAUCHE : formulaire + logo animé devant ─── -->
    <div class="left-side">

      <!-- Formulaire inscription (en dessous dans le DOM) -->
      <div class="container">
        <h1><i class="fas fa-user-plus" style="color:#e0c9a6;margin-right:8px;"></i>Créer un compte</h1>

        <form action="inscription.php" method="POST" id="signupForm">

          <div class="form-group">
            <label for="nom"><i class="fas fa-user"></i> Nom</label>
            <input type="text" id="nom" name="nom" required placeholder="Votre nom">
          </div>

          <div class="form-group">
            <label for="prenom"><i class="fas fa-user"></i> Prénom</label>
            <input type="text" id="prenom" name="prenom" required placeholder="Votre prénom">
          </div>

          <div class="form-group">
            <label for="numero_INE"><i class="fas fa-id-card"></i> Numéro INE</label>
            <input type="text" id="numero_INE" name="numero_INE" required placeholder="Votre numéro INE">
          </div>

          <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" name="email" required placeholder="Votre adresse email">
            <small id="emailError" style="display:none;">L'email est déjà utilisé ou invalide.</small>
          </div>

          <div class="form-group">
            <label for="motdepasse"><i class="fas fa-lock"></i> Mot de passe</label>
            <input type="password" id="motdepasse" name="motdepasse" required placeholder="Votre mot de passe" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="confirm_motdepasse"><i class="fas fa-lock"></i> Confirmer le mot de passe</label>
            <input type="password" id="confirm_motdepasse" name="confirm_motdepasse" required placeholder="Confirmez votre mot de passe" autocomplete="new-password">
            <small id="passwordError" style="display:none;">Les mots de passe ne correspondent pas.</small>
          </div>

          <div class="form-group">
            <label for="classe"><i class="fas fa-school"></i> Classe</label>
            <select id="classe" name="classe">
              <option value="CPGE-MPSI">CPEI-MPSI</option>
              <option value="CPGE-PCSI">CPEI-PCSI</option>
              <option value="CPGE-MP">CPEI-MP</option>
              <option value="CPGE-PC">CPEI-PC</option>
              <option value="GENIE-INFORMATIQUE-1">GÉNIE INFORMATIQUE 1</option>
              <option value="GENIE-INFORMATIQUE-2">GÉNIE INFORMATIQUE 2</option>
              <option value="GENIE-INFORMATIQUE-3">GÉNIE INFORMATIQUE 3</option>
              <option value="GENIE-TEXTILE-1">GÉNIE TEXTILE 1</option>
              <option value="GENIE-TEXTILE-2">GÉNIE TEXTILE 2</option>
              <option value="GENIE-TEXTILE-3">GÉNIE TEXTILE 3</option>
              <option value="GENIE-TELECOMS-1">GÉNIE TELECOMS 1</option>
              <option value="GENIE-TELECOMS-2">GÉNIE TELECOMS 2</option>
              <option value="GENIE-TELECOMS-3">GÉNIE TELECOMS 3</option>
              <option value="GENIE-MECANIQUE-1">GÉNIE MÉCANIQUE 1</option>
              <option value="GENIE-MECANIQUE-2">GÉNIE MÉCANIQUE 2</option>
              <option value="GENIE-MECANIQUE-3">GÉNIE MÉCANIQUE 3</option>
              <option value="GENIE-INDUSTRIELLE-1">GÉNIE INDUSTRIELLE 1</option>
              <option value="GENIE-INDUSTRIELLE-2">GÉNIE INDUSTRIELLE 2</option>
              <option value="GENIE-INDUSTRIELLE-3">GÉNIE INDUSTRIELLE 3</option>
            </select>
          </div>

          <button type="submit"><i class="fas fa-user-plus"></i> S'inscrire</button>
        </form>

        <p>Déjà inscrit ? <a href="interface_login.html">Se connecter</a></p>

        <div class="social-login">
          <a href="#">
            <img src="Images/image_icone_google.webp" alt="Google" class="google-icon">
            Continuer avec Google
          </a>
        </div>
      </div>

      <!-- Logo EPO EN AVANT : vient APRÈS le formulaire dans le DOM
           = naturellement au-dessus en rendu CSS, quel que soit le stacking context.
           pointer-events:none = les clics/saisies traversent et atteignent le formulaire -->
      <div class="logo-bg" aria-hidden="true">
        <img src="Images/epo_logo.png" class="logo-animated" alt="">
      </div>

    </div>

    <!-- ─── DROITE : photo EPO plein écran ─── -->
    <div class="right-side-image"></div>

  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      const pwd     = document.getElementById('motdepasse').value;
      const confirm = document.getElementById('confirm_motdepasse').value;
      const errEl   = document.getElementById('passwordError');
      errEl.style.display = 'none';
      if (pwd !== confirm) {
        e.preventDefault();
        errEl.style.display = 'block';
      }
    });
  </script>

</body>
</html>
